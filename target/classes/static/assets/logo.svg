<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Chat Bubble Background -->
  <path d="M 20 20 H 80 A 15 15 0 0 1 95 35 V 60 A 15 15 0 0 1 80 75 H 45 L 25 90 V 75 H 20 A 15 15 0 0 1 5 60 V 35 A 15 15 0 0 1 20 20 Z" 
        fill="url(#gradPrimary)" filter="url(#glow)" />

  <!-- Wi-Fi / LAN Network Waves Inside -->
  <path d="M 35 40 A 20 20 0 0 1 65 40" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" />
  <path d="M 42 48 A 12 12 0 0 1 58 48" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" />
  <circle cx="50" cy="56" r="3.5" fill="#ffffff" />
</svg>
